services:
  postgres:
    image: postgres:18
    container_name: endurant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ENDURANT_PGUSER:-postgres}
      POSTGRES_PASSWORD: ${ENDURANT_PGPASSWORD:-postgres}
      POSTGRES_DB: ${ENDURANT_PGDATABASE:-endurant_test}
    ports:
      - "${ENDURANT_PGPORT:-5432}:5432"
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
